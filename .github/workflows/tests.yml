name: Tests

on:
  push:
    branches:
      - main
    tags:
      - "*"
    # Skip tests when a push/PR only touches docs
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".readthedocs.y*ml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".readthedocs.y*ml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # let the other shards finish if one fails
      matrix:
        python-version: ["3.11", "3.13"]
        # Split the suite across runners (4 cores each) to cut wall time
        shard: [0, 1, 2, 3]
    steps:
      # Setup uv: https://docs.astral.sh/uv/guides/integration/github/#using-uv-pip
      - uses: actions/checkout@v5
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      # Run tests
      - name: Run tests
        run: |
          uv run --group test --python ${{ matrix.python-version }} -m pytest \
            --shard-id=${{ matrix.shard }} --num-shards=4 \
            --cov --cov-branch --cov-report=xml -n auto tests
        env:
          # JAX_ENABLE_X64: ${{ matrix.x64 }}
          JAX_ENABLE_X64: 1

      # Create coverage report
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: smolgp-dev/smolgp
            
